<!DOCTYPE html>
<html>
<head>
  <title>Div UI Examples</title>
  <style>
    .div-container {
      background-color: red;
      width: 100px;
      height: 100px;
      display: inline-block;
      margin-right: 5px;
    }
    .div-circle {
      background-color: green;
      width: 100px;
      height: 100px;
      border-radius: 50px;
      display: inline-block;
      margin-left: 20px;
    }

    
    .service-div {
      border: 1px solid rgb(191, 178, 178);
      width: 250px;
      height: 70px;
      padding-top: 10px;
      padding-left: 12px;
      font-weight: bold;
      font-family: arial;
      font-size: 13px;
      color: rgb(67, 66, 66);
      display: block;
      margin-top: 15px;
      margin-bottom: 0;
    }
    .button-row {
      margin-top: 10px;
    }
    .yes-button {
      display: inline-block;
      cursor: pointer;    
    }
    .no-button {
      display: inline-block;
      cursor: pointer;
    }


    .YouTube-Music-div {
      background-color: black;
      width: 300px;
      height: 70px;
      padding-left: 10px;
      padding-top: 5px;
      margin-top: 30px;
      font-family: arial;
      font-size: 12px;
    }
    .YouTube-Music {
      color: rgb(236, 233, 233);
      margin-bottom: 0;
      margin-top: 10px;
      font-size: 13px;
      font-weight: bold;
    }
    .YouTube-Music-description {
      color: gray;
      margin-top: 5px;
    }
  </style>

</head>
<body>
  <div class="div-container">
    
  </div>

  <div class="div-circle">
    
  </div>

  <div class="service-div">
    Satisfied with our service?
    <div class="button-row">
      <button class="yes-button">
        Yes
      </button>
      <button class="no-button">
        No
      </button>
    </div>
  </div>

  <div class="YouTube-Music-div">
    <p class="YouTube-Music">
      Install YouTube Music
    </p>
    <p class="YouTube-Music-description">
      Add YouTube Music to your desktop for quick and easy access.
    </p>
  </div>
</body>
</html>
