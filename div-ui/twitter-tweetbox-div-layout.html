<!DOCTYPE html>
<html>
  <head>
    <title>Tweetbox Div Layout</title>

    <style>
      .thumbnail {
        margin-top: 3px;
        width: 40px;
        height: 40px;
        object-fit: cover;
        border-radius: 50px;
        vertical-align: middle;
        margin-left: 5px;
      }
      .twiter-input {
        vertical-align: middle;
        margin-left: 5px;
        border: none;
        font-family: arial;
        font-size: 13px;
        margin-right: 10px;
      }
      .tweet-button {
        vertical-align: middle;
        width: 70px;
        height: 30px;
        border-radius: 20px;
        margin-left: 30px;
        background-color: rgba(64, 124, 202, 0.981);
        border: none;
        color: white;
        font-weight: bold;
        cursor: pointer;
      }
      .tweet-button:hover {
        background-color: rgba(29, 161, 242, 0.979);
        color: rgb(209, 207, 207);
        transition: 0.5s;
      }
      .tweet-preview {
        display: block;
        border: 1px solid lightgray;
        width: 340px;
        height: 45px;
        padding: 5px;
        box-shadow: 0px 0px 5px rgb(170, 170, 170);
        border-radius: 5px;
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <div class="tweet-preview">
      <img class="thumbnail" src="../random-images/617554347_935025872523658_7918739619956122880_n.jpg">
      <input class="twiter-input" type="text" placeholder="What's happening?">
      <button class="tweet-button">
      Tweet
      </button>
    </div>
  </body>
</html>
