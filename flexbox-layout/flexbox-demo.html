<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Practice</title>
  </head>
  <body style="padding-bottom: 1000px;">
    <div style="
      display: flex;
      flex-direction: row;
      ">
      <div style="background-color: lightblue;">div 1 text</div>
      <div style="background-color: lightpink;">div 2 <p>text</p></div>
    </div>
    
    <div style="
      margin-top: 20px;
      display: flex;
      flex-direction: row;
      ">
      <div style="background-color: lightblue;
      width: 100px;
      ">100px</div>
      <div style="background-color: lightpink;
      flex: 1;">flex 1</div>
    </div>

    <div style="
      margin-top: 20px;
      display: flex;
      flex-direction: row;
      ">
      <div style="background-color: lightpink;
      flex: 1;">flex 1</div>
      <div style="background-color: lightblue;
      width: 100px;
      ">100px</div>
      <div style="background-color: lightpink;
      flex: 2;
      ">flex 2</div>
    </div>

    <div style="
      margin-top: 20px;
      display: flex;
      flex-direction: row;
      height: 70px;
      border: 1px solid gray;
      justify-content: center;
      ">
      <div style="background-color: lightpink;
      width: 100px;
      ">100px</div>
      <div style="background-color: lightblue;
      width: 100px;
      ">100px</div>
      <div style="background-color: lightpink;
      width: 100px;
      ">100px</div>
    </div>

    <div style="
      margin-top: 20px;
      display: flex;
      flex-direction: row;
      height: 70px;
      border: 1px solid gray;
      justify-content: space-between;
      ">
      <div style="background-color: lightpink;
      width: 100px;
      ">100px</div>
      <div style="background-color: lightblue;
      width: 100px;
      ">100px</div>
      <div style="background-color: lightpink;
      width: 100px;
      ">100px</div>
    </div>

    <div style="
      margin-top: 20px;
      display: flex;
      flex-direction: row;
      height: 70px;
      border: 1px solid gray;
      justify-content: space-between;
      align-items: center;
      ">
      <div style="background-color: lightpink;
      width: 100px;
      ">100px</div>
      <div style="background-color: lightblue;
      width: 100px;
      ">100px</div>
      <div style="background-color: lightpink;
      width: 100px;
      ">100px</div>
    </div>
    <div style="
      margin-top: 50px;
      display: flex;
      flex-direction: row;
      ">
      <div style="background-color: lightblue; width: 200px;">200px</div>
      <div style="background-color: lightsalmon; width: 75px;">75px</div>
    </div>
    <div style="
      margin-top: 20px;
      display: flex;
      ">
      <div style="
      background-color: lightblue;
      width: 50px;">item1</div>
      <div style="
      background-color: lightpink;
      flex: 1;">item2</div>
      <div style="
      background-color: lightblue;
      width: 75px;">item3</div>
    </div>
    <div style="
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      ">
      <div style="
      background-color: lightblue;
      width: 37px;">item1</div>
      <div style="
      background-color: lightpink;
      width: 37px;">item2</div>
      <div style="
      background-color: lightblue;
      width: 37px;">item3</div>
      <div style="
      background-color: lightpink;
      width: 37px;">item4</div>
    </div>
    <div style="
      margin-top: 20px;
      display: flex;
      height: 50px;
      border: 2px solid lightgray;
      justify-content: space-between;
      align-items: center;
      ">
      <div style="background-color: pink;">item1</div>
      <div style="background-color: pink;">item2</div>
    </div>
  </body>
</html>
