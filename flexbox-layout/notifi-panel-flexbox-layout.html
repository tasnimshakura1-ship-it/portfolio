<!DOCTYPE html>
<html>
  <head>
    <title>Notification Panel Flexbox</title>
  </head>
  <body>
    <div style="
      font-family: arial;
      font-size: 14px;
      width: 250px;
      height: 90px;
      border: 1px solid lightgray;
      border-radius: 5px;
      margin-bottom: 0;">
      <div style="
       display: flex;
       justify-content: space-between;
       margin-top: 5px;">
       <div style="
       margin-left: 10px;">Home</div> 
       <div style="
       background-color: rgb(100, 100, 245);
       width: 20px;
       margin-right: 10px;
       border-radius: 20px;
       padding-left: 8px;
       padding-right: 5px;
       color: aliceblue;
       ">14</div>
      </div>
      
      <div style="
       display: flex;
       justify-content: space-between;
       margin-top: 12px;">
       <div style="
       margin-left: 10px;">Notification</div> 
       <div style="
       background-color: rgb(100, 100, 245);
       width: 12px;
       margin-right: 10px;
       border-radius: 20px;
       padding-left: 9px;
       padding-right: 5px;
       color: aliceblue;
       ">3</div>
      </div>

      <div style="
       display: flex;
       justify-content: space-between;
       margin-top: 12px;">
       <div style="
       margin-left: 10px;">Messages</div> 
       <div style="
       background-color: rgb(100, 100, 245);
       width: 12px;
       margin-right: 10px;
       border-radius: 20px;
       padding-left: 9px;
       padding-right: 5px;
       color: aliceblue;
       ">5</div>
      </div>
    </div>
  </body>
</html>
