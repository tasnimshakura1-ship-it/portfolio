<!DOCTYPE html>
<html>
  <head>
    <title>Request Ride Block Layout Challenge</title>
    <style>
      .request-ride {
        font-size: 35px;
        font-family: arial;
        color: rgb(47, 47, 47);
        margin-bottom: 0;
      }
      .location-input {
        display: block;
        margin-top: 18px;
        font-size: 12px;
        width: 300px;
        height: 32px;
        background-color: rgb(243, 240, 240);
        border: none;
        padding-left: 15px;
        cursor: pointer;
      }
      .destination-input {
        display: block;
        margin-top: 5px;
        font-size: 12px;
        width: 300px;
        height: 32px;
        background-color: rgb(243, 240, 240);
        border: none;
        padding-left: 15px;
        cursor: pointer;
      }
      .requnow {
        margin-top: 24px;
        width: 95px;
        height: 30px;
        background-color: black;
        text-align: center;
        font-size: 12px;
        border: none;
        cursor: pointer;
      }
      .requnow::placeholder {
        color: rgb(222, 221, 221);
      }
      .Schedule {
        width: 120px;
        height: 32px;
        background-color: rgb(243, 240, 240);
        border: none;
        margin-left: 10px;
        cursor: pointer;
        text-align: center;
        font-size: 12px;
      }
      .Schedule::placeholder {
        color: rgb(22, 22, 22);
      }

    </style>
  </head>
  <body>
    <p class="request-ride">
      Request a ride now
    </p>
    <input class="location-input" type="location" placeholder="Enter pickup location">
    <input class="destination-input" type="destination" placeholder="Enter destination">
    <input class="requnow" type="text" placeholder="Request now">
    <input class="Schedule" type="text" placeholder="Schedule for later">
  </body>
</html>
