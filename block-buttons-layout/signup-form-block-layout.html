<!DOCTYPE html>
<html>
  <head>
    <title>SignUp Form Block Layout Challenge</title>
    <style>
      .first-name {
        width: 110px;
        height: 28px;
        border-radius: 5px;
        padding-left: 10px;
        font-weight: bold;
        border: 1px solid rgb(175, 173, 173);
        cursor: pointer;
      }
      .last-name {
        width: 110px;
        height: 28px;
        border-radius: 5px;
        padding-left: 10px;
        font-weight: bold;
        border: 1px solid rgb(175, 173, 173);
        cursor: pointer;
      }
      .email-input {
        display: block;
        margin-top: 10px;
        width: 240px;
        height: 28px;
        border-radius: 5px;
        padding-left: 10px;
        font-weight: bold;
        border: 1px solid rgb(175, 173, 173);
        cursor: pointer;
      }
      .sign-up {
        margin-top: 10px;
        display: block;
        width: 250px;
        height: 34px;
        border-radius: 5px;
        text-align: center;
        font-weight: bold;
        background-color: rgb(84, 84, 242);
        border: none;
        font-size: 14px;
        cursor: pointer;
      }
      .sign-up::placeholder {
        color: white;
      }
    </style>
  </head>
  <body>
    <input class="first-name" type="text" placeholder="First name">
    <input class="last-name" type="text" placeholder="Last name">
    <input class="email-input" type="email" placeholder="Email">
    <input class="sign-up" type="signup" placeholder="Sign Up">
  </body>
</html>
