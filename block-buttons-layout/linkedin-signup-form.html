<!DOCTYPE html>
<html>
  <head>
    <title>Linkedin Signup</title>
    <style>
      .email-p {
        font-size: 12px;
        font-family: Arial;
        color: rgb(82, 80, 80);
        margin-bottom: 5px;
      }
      .email-input {
        width: 250px;
        border: 2px solid gray;
        border-radius: 4px;
        margin-bottom: 12px;
      }
      .Privacy-Policy {
        font-size: 12px;
        font-family: Arial;
        color: rgb(82, 80, 80);
        margin-top: 0;
        margin-bottom: 12px;
      }
      .Agree-Join {
        font-size: 14px;
        font-family: Arial;
        width: 255px;
        height: 35px;
        color: rgb(246, 245, 245);
        background-color: rgb(75, 75, 208);
        border: none;
        border-radius: 25px;
        cursor: pointer;
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <p class="email-p">
      Email
    </p>
    <input class="email-input" type="email">
    <p class="Privacy-Policy">
      By clicking Agree & Join, you agree to the Privacy Policy.
    </p>
    <button class="Agree-Join">
      Agree & Join
    </button>
  </body>
</html>
