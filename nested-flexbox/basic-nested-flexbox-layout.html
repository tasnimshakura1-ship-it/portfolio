<!DOCTYPE html>
<html>
  <head>
    <title>Basic Nested Flexbox</title>
  </head>
  <body>
    <div style="
      display: flex;">
      <div style="width: 100px;
       background-color: pink;
       height: 50px;
       ">
       <div style="display: flex;
          align-items: center;
          background-color: black;
          color: aliceblue;
          width: 40px;
          margin-top: 15px;
          margin-left: 30px;">
          item1
       </div>
      </div>
      <div style="width: 200px;
       background-color: lightblue;">
      </div>
    </div>

    <div style="
      display: flex;
      margin-top: 50px;">
      <div style="width: 100px;
       background-color: pink;
       height: 60px;
       ">
      </div>
      <div style="width: 200px;
       background-color: lightblue;
       ">
       <div style="margin-top: 4px;">
          row1
       </div>
       <div style="display: flex;
          align-items: center;
          justify-content: space-between;">
          <div style="background-color: black;
           color: aliceblue;
           width: 35px;">
           row2
          </div>
          <div style="background-color: black;
           color: aliceblue;
           width: 35px;">
           row2
          </div>
       </div>
      </div>
    </div>
  </body>
</html>
