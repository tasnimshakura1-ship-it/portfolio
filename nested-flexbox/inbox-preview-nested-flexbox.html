<!DOCTYPE html>
<html>
  <head>
    <title>Inbox Card Mockup</title>
    <link rel="stylesheet" href="../styles/inbox-card-nested-flexbox.css">
  </head>
  <body>
    <div style="
      display: flex;
      flex-direction: column;
      height: 210px;
      width: 275px;
      border: 1px solid lightgray;
      font-family: arial;
      padding-left: 10px;
      box-shadow: 2px 2px 5px rgba(209, 209, 209, 0.434);
      border-radius: 2px;">
     <div style="
        color: gray;
        font-size: 9px;
        margin-top: 7px;
        height: 20px;
        ">
        ALL INBOXES
     </div>
     <div class="nested-flexbox">
       <img class="pp1" src="../random-images/IMG_20260109_205148.jpg">
        <div class="headline">
         <div class="promo-description">
           <div class="promo">Chewy Promotions</div>
           <div class="time">4:58PM</div>
         </div>
         <div class="sale">Biggest sales of the year!</div>
         <div class="description">Hey there! We're writing to tell you about our...</div>
        </div>
     </div>
     <div class="nested-flexbox">
       <img class="pp1" src="../random-images/FB_IMG_1745392413089.jpg">
        <div class="headline">
         <div class="promo-description">
           <div class="promo">Best Buy</div>
           <div class="time">12:32PM</div>
         </div>
         <div class="sale">Your Best Buy eReceipt</div>
         <div class="description">Thank you for shopping at Best Buy, here is...</div>
        </div>
     </div>
     <div class="nested-flexbox">
       <img class="pp1" src="../random-images/FB_IMG_1752696501065.jpg">
        <div class="headline">
         <div class="promo-description">
           <div class="promo">Netflix</div>
           <div class="time">9:00AM</div>
         </div>
         <div class="sale">Here's what's coming soon to Netflix</div>
         <div class="description">Brand new movies and shows, old favourites...</div>
        </div>
     </div>
    </div>
  </body>
</html>
