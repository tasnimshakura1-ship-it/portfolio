<!DOCTYPE html>
<html>
  <head>
    <title>Twitter YouTube Preview Card</title>
    <link rel="stylesheet" href="../styles/twitter-youtube-nested-flexbox.css">
  </head>
  <body>
    <div class="container">
      <div class="image-container">
        <img class="twitter-image" src="../random-images/FB_IMG_1745392413089.jpg">
      </div>
      <div class="twitter-container">
        <div class="twitter-header-container">
          <div class="twitter-header">thorfinnthordar.son</div>
          <div class="twitter-address">@ThorfinnThordarSon</div>
        </div>
        <div class="tweet">
          What is backend web development? A complete overview. New video is up!
        </div>
        <div class="youtube-container">
          <div class="yt-vid-img"></div>
          <div class="youtube-video">
            <div class="video-link">
              <a href="https://www.youtube.com/" target="_blank" class="vid-link-a">youtube.com</a>
            </div>
            <div class="video-title">
              Backend web development - a complete overview &#40;2021&#41;
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
